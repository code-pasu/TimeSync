[project]
name = "timesync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eventlet<0.37.0",
    "matplotlib>=3.11.2",
    "mininet",
    "os-ken<4.0.0",
    "requests>=2.34.2",
    "setuptools<80",
]

[project.scripts]
timesync = "timesync:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
mininet = { git = "https://github.com/mininet/mininet.git" }
